[package]
name = "coordinator"
version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
candle-core = { version = "0.11.0" }
clap = { version = "4.5.4", features = ["derive"] }
prost = { version = "0.14.1" }
safetensors = { version = "0.8.0" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.15" }
tonic = { version = "0.14.2" }
tonic-health = { version = "0.14.2" }
tonic-prost = { version = "0.14.2" }
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18" }
uuid = { version = "1.8.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = { version = "0.14.2" }

[dev-dependencies]
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-stream = { version = "0.1.15" }
tonic = { version = "0.14.2", features = ["transport"] }

[lints]
workspace = true
