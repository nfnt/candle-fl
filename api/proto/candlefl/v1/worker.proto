syntax = "proto3";

package candlefl.v1;

message WorkerMessage {
    oneof message {
        WeightsResponse weights_response = 1;
        FitResponse fit_response = 2;
    }
}

message WeightsResponse {
    string job_id = 1;
    bytes weights = 2;
}

message FitResponse {
    string job_id = 1;
    bytes weights = 2;
    // Absent if the worker could not produce metrics for this round.
    FitMetrics metrics = 3;
}

message FitMetrics {
    float loss = 1;
    uint64 num_examples = 2;
}
